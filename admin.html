<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>课程授权后台</title>
<style>body{margin:0;padding:40px 18px;background:#f6f1e8;font-family:system-ui,"Microsoft YaHei",sans-serif;color:#111}.panel{max-width:820px;margin:auto;padding:30px;background:#fff;border:2px solid #111;box-shadow:10px 10px #f8e43f}h1{margin-top:0}form{display:grid;gap:12px}label{display:grid;gap:6px;font-weight:800}input{padding:12px;border:2px solid #aaa;font:inherit}button{padding:11px 16px;border:2px solid #111;background:#f2483e;color:#fff;font-weight:900;cursor:pointer}.secondary{background:#fff;color:#111}.hidden{display:none}.result{margin-top:20px;padding:18px;background:#111;color:#fff}.result code{color:#f8e43f;font-size:18px;word-break:break-all}.error{color:#c22;font-weight:800}.records{margin-top:28px;border-top:1px solid #ccc;padding-top:18px}.record{display:grid;grid-template-columns:1.4fr 1fr auto auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #ddd}.muted{color:#777}@media(max-width:650px){.record{grid-template-columns:1fr}.panel{padding:22px}}</style>
<body><main class="panel"><h1>课程授权后台</h1><p>先用后台主密钥登录。你可以生成、重新生成、查看状态和撤销客户授权。</p><form id="login"><label>后台主密钥<input id="masterKey" type="password" required></label><button>进入后台</button></form><section id="workspace" class="hidden"><form id="generate"><label>客户手机号或邮箱<input id="identifier" required></label><button>生成 / 重新生成密钥</button></form><p id="error" class="error"></p><div id="result" class="result hidden">账号：<code id="outId"></code><br>新密钥：<code id="outKey"></code></div><section class="records"><strong>授权记录</strong><div id="records-list" class="muted">载入中…</div></section></section></main>
<script>const login=document.querySelector('#login'),workspace=document.querySelector('#workspace'),generate=document.querySelector('#generate'),error=document.querySelector('#error'),recordsList=document.querySelector('#records-list');async function loadRecords(){const r=await fetch('/api/admin/records');if(!r.ok){recordsList.textContent='无法读取授权记录';return}const data=await r.json();recordsList.innerHTML=data.records.length?data.records.sort((a,b)=>b.updatedAt.localeCompare(a.updatedAt)).map(x=>`<div class="record"><span>${x.identifier}</span><span>${x.status==='active'?'有效':'已撤销'} · ${new Date(x.updatedAt).toLocaleString()}</span><button class="secondary" data-revoke="${x.identifier}" ${x.status==='revoked'?'disabled':''}>撤销</button><button data-regenerate="${x.identifier}">重新生成</button></div>`).join(''):'暂无授权记录'}login.addEventListener('submit',async e=>{e.preventDefault();const r=await fetch('/api/admin/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({masterKey:document.querySelector('#masterKey').value})});if(!r.ok){error.textContent='后台主密钥不正确';return}login.classList.add('hidden');workspace.classList.remove('hidden');loadRecords()});generate.addEventListener('submit',async e=>{e.preventDefault();error.textContent='';const identifier=document.querySelector('#identifier').value.trim();const r=await fetch('/api/admin/generate',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({identifier})});const data=await r.json();if(!r.ok){error.textContent=data.message||'生成失败';return}document.querySelector('#outId').textContent=data.identifier;document.querySelector('#outKey').textContent=data.key;document.querySelector('#result').classList.remove('hidden');loadRecords()});recordsList.addEventListener('click',async e=>{const revoke=e.target.closest('[data-revoke]'),regen=e.target.closest('[data-regenerate]');if(revoke){if(!confirm('撤销后客户将无法继续登录，确定吗？'))return;await fetch('/api/admin/records',{method:'DELETE',headers:{'content-type':'application/json'},body:JSON.stringify({identifier:revoke.dataset.revoke})});loadRecords()}if(regen){document.querySelector('#identifier').value=regen.dataset.regenerate;generate.requestSubmit()}});</script></body></html>
