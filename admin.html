<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>课程授权后台</title>
<style>body{margin:0;padding:48px 20px;background:#f6f1e8;font-family:system-ui,"Microsoft YaHei",sans-serif;color:#111}.panel{max-width:620px;margin:auto;padding:32px;background:#fff;border:2px solid #111;box-shadow:10px 10px #f8e43f}h1{margin-top:0}form{display:grid;gap:14px}label{display:grid;gap:6px;font-weight:800}input{padding:12px;border:2px solid #aaa;font:inherit}button{padding:12px;border:2px solid #111;background:#f2483e;color:#fff;font-weight:900;cursor:pointer}.hidden{display:none}.result{margin-top:22px;padding:18px;background:#111;color:#fff}.result code{color:#f8e43f;font-size:18px;word-break:break-all}.error{color:#c22;font-weight:800}</style>
<main class="panel"><h1>课程授权后台</h1><p>先输入后台主密钥。登录后，再为客户生成专属课程密钥。</p><form id="login"><label>后台主密钥<input id="masterKey" type="password" required></label><button>进入后台</button></form><section id="workspace" class="hidden"><form id="generate"><label>客户手机号或邮箱<input id="identifier" required></label><button>生成客户密钥</button></form><p id="error" class="error"></p><div id="result" class="result hidden">账号：<code id="outId"></code><br>客户密钥：<code id="outKey"></code></div></section></main>
<script>const login=document.querySelector('#login'),workspace=document.querySelector('#workspace'),generate=document.querySelector('#generate'),error=document.querySelector('#error');login.addEventListener('submit',async e=>{e.preventDefault();const r=await fetch('/api/admin/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({masterKey:document.querySelector('#masterKey').value})});if(!r.ok){error.textContent='后台主密钥不正确';return}login.classList.add('hidden');workspace.classList.remove('hidden')});generate.addEventListener('submit',async e=>{e.preventDefault();error.textContent='';const identifier=document.querySelector('#identifier').value.trim();const r=await fetch('/api/admin/generate',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({identifier})});const data=await r.json();if(!r.ok){error.textContent=data.message||'生成失败';return}document.querySelector('#outId').textContent=data.identifier;document.querySelector('#outKey').textContent=data.key;document.querySelector('#result').classList.remove('hidden')});</script></html>
