  <line x1="104" y1="908" x2="1496" y2="908" stroke="#141412" stroke-width="3"/>
  <text x="104" y="938" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19" font-weight="700" fill="#141412">浏览器自动化的关键：让 Agent 处理你已经判断过的好东西。</text>
