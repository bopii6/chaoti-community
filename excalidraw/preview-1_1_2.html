<!doctype html><meta charset="utf-8"><title>给你的 AI 员工办入职：装好三个工具</title>
<style>body{margin:0;background:#eeeae2;font-family:Arial,"Microsoft YaHei",sans-serif;color:#171714}.bar{position:sticky;top:0;background:#f6e33f;border-bottom:2px solid #171714;padding:14px 20px;font-weight:900}.bar button{margin-left:8px;padding:6px 12px;border:2px solid #171714;background:white;font-weight:900}.board{width:min(1100px,88vw);margin:28px auto;padding:42px;min-height:620px;background:#fffdf8;border:3px solid #171714;box-shadow:8px 8px #171714}.k{color:#b94b35;font-weight:900}.t{font-size:clamp(30px,5vw,64px);font-weight:900;margin:24px 0}.s{font-size:20px;color:#66635c}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:34px}.c{padding:22px;border:2px solid #171714;background:#fff4a8;min-height:100px}.c:nth-child(2n){background:#dff0e8}.c b{color:#b94b35}.c p{font-size:20px;font-weight:800;line-height:1.5}.f{margin-top:36px;padding-top:18px;border-top:2px solid #171714;color:#b94b35;font-weight:900}@media(max-width:700px){.board{padding:24px}.grid{grid-template-columns:1fr}.s{font-size:16px}}</style>

<script>let x,i=0;const a=document.querySelector('#a'),n=document.querySelector('#n'),e=s=>String(s||'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));function r(){const z=x.screens[i],l=z.layout;let items=l.type==='comparison'?[l.left,l.right]:l.cards||l.steps||l.items?.map(v=>({title:v,body:''}))||l.rows?.flat().map(v=>({title:'重点',body:v}))||l.lines?.map(v=>({title:'带走一句话',body:v}))||[];a.innerHTML='<section class="board"><div class="k">'+e(x.title)+'</div><div class="t">'+e(z.title)+'</div><div class="s">'+e(z.subtitle)+'</div><div class="grid">'+items.map((v,j)=>'<div class="c"><b>'+String(j+1).padStart(2,'0')+' · '+e(v.title)+'</b><p>'+e(v.body).replaceAll('\n','<br>')+'</p></div>').join('')+'</div><div class="f">'+e(l.footer)+'</div></section>';n.textContent=(i+1)+' / '+x.screens.length}p.onclick=()=>{i=(i+5)%6;r()};q.onclick=()=>{i=(i+1)%6;r()};fetch('给你的 AI 员工办入职：装好三个工具.spec.json').then(r=>r.json()).then(v=>{x=v;r()});</script>
