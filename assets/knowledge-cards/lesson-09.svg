font-family="Arial, Microsoft YaHei, sans-serif" font-size="21" font-weight="900" fill="#11110f">准备工作：先备份，再准备 API </text><text x="848" y="515" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21" font-weight="900" fill="#11110f">Key</text><text x="848" y="545" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#5c5a54">照着步骤操作，并检查结果</text><rect x="88" y="590" width="680" height="150" fill="#fff4a8" stroke="#11110f" stroke-width="3"/><rect x="88" y="590" width="10" height="150" fill="#f0523e"/><text x="118" y="628" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" font-weight="900" fill="#f0523e">03</text><text x="118" y="672" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21" font-weight="900" fill="#11110f">完整教程：在 Codex 中接入 </text><text x="118" y="703" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21" font-weight="900" fill="#11110f">DeepSeek</text><text x="118" y="733" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#5c5a54">照着步骤操作，并检查结果</text><rect x="818" y="590" width="680" height="150" fill="#dff0e8" stroke="#11110f" stroke-width="3"/><rect x="818" y="590" width="10" height="150" fill="#f0523e"/><text x="848" y="628" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" font-weight="900" fill="#f0523e">04</text><text x="848" y="672" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21" font-weight="900" fill="#11110f">第 1 步：打开 Codex 供应</text><text x="848" y="703" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21" font-weight="900" fill="#11110f">商面板</text><text x="848" y="733" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#5c5a54">照着步骤操作，并检查结果</text><text x="88" y="842" font-family="Arial, Microsoft YaHei, sans-serif" font-size="31" font-weight="900" fill="#f0523e">从知道 → 会用 → 跑通 → 复用</text></svg>