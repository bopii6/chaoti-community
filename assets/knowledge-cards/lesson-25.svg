<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><rect width="1600" height="1000" fill="#f8f2e8"/><rect x="36" y="36" width="1528" height="928" fill="#fffdf8" stroke="#11110f" stroke-width="4"/><text x="88" y="112" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#f0523e">Agent 能力扩展 · 知识点卡片 25</text><text x="88" y="184" font-family="Arial, Microsoft YaHei, sans-serif" font-size="46" font-weight="900" fill="#11110f">浏览器自动化进阶：操作网页后台与发布</text><text x="88" y="254" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#5c5a54">没有 API 的网站也能操作：填表、发布、批量处理</text><text x="88" y="350" font-family="Arial, Microsoft YaHei, sans-serif" font-size="27" font-weight="900" fill="#11110f">让 Agent 通过浏览器完成‘打开 → 读取 → 操作 → 返回结果’</text><rect x="88" y="414" width="310" height="250" fill="#f8ded7" stroke="#11110f" stroke-width="3"/><rect x="88" y="414" width="10" height="250" fill="#f0523e"/><text x="118" y="452" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" font-weight="900" fill="#f0523e">打开</text><text x="118" y="496" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21" font-weight="900" fill="#11110f">能操作什么</text><text x="118" y="557" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#5c5a54">登录、验证码和权限由你确认</text><text x="420" y="545" font-family="Arial, Microsoft YaHei, sans-serif" font-size="30" font-weight="400" fill="#f0523e">→</text><rect x="480" y="414" width="310" height="250" fill="#fff4a8" stroke="#11110f" stroke-width="3"/><rect x="480" y="414" width="10" height="250" fill="#f0523e"/><text x="510" y="452" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" font-weight="900" fill="#f0523e">定位</text><text x="510" y="496" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21" font-weight="900" fill="#11110f">安全边界</text><text x="510" y="557" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#5c5a54">限定页面、收藏夹或字段</text><text x="812" y="545" font-family="Arial, Microsoft YaHei, sans-serif" font-size="30" font-weight="400" fill="#f0523e">→</text><rect x="872" y="414" width="310" height="250" fill="#dff0e8" stroke="#11110f" stroke-width="3"/><rect x="872" y="414" width="10" height="250" fill="#f0523e"/><text x="902" y="452" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" font-weight="900" fill="#f0523e">处理</text><text x="902" y="496" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21" font-weight="900" fill="#11110f">先把‘数字员工’说具体</text><text x="902" y="557" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#5c5a54">提取信息、分析变化或执行动作</text><text x="1204" y="545" font-family="Arial, Microsoft YaHei, sans-serif" font-size="30" font-weight="400" fill="#f0523e">→</text><rect x="1264" y="414" width="248" height="250" fill="#e9e6dd" stroke="#11110f" stroke-width="3"/><rect x="1264" y="414" width="10" height="250" fill="#11110f"/><text x="1294" y="452" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" font-weight="900" fill="#11110f">交付</text><text x="1294" y="496" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21" font-weight="900" fill="#11110f">它由哪些东西组成</text><text x="1294" y="557" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#5c5a54">重要动作停在人工确认</text><text x="88" y="820" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25" font-weight="900" fill="#f0523e">浏览器自动化的价值：把网页里的重复动作交给 Agent。</text></svg>