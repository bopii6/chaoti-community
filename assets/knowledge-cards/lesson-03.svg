<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><rect width="1600" height="1000" fill="#f8f2e8"/><rect x="36" y="36" width="1528" height="928" fill="#fffdf8" stroke="#11110f" stroke-width="4"/><text x="88" y="112" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#f0523e">心态篇 · 知识点卡片 03</text><text x="88" y="184" font-family="Arial, Microsoft YaHei, sans-serif" font-size="46" font-weight="900" fill="#11110f">第一次卡住怎么办</text><text x="88" y="254" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#5c5a54">停下来、看清楚、再问一次，不靠换工具逃避</text><rect x="88" y="342" width="680" height="190" fill="#fff4a8" stroke="#11110f" stroke-width="3"/><rect x="88" y="342" width="10" height="190" fill="#f0523e"/><text x="118" y="380" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" font-weight="900" fill="#f0523e">核心判断</text><text x="118" y="424" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21" font-weight="900" fill="#11110f">先别急着换工具</text><text x="118" y="485" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#5c5a54">你能记录第一次失败发生在哪里，并按固定格式向 A</text><text x="118" y="511" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#5c5a54">I 或老师求助。</text><rect x="832" y="342" width="680" height="190" fill="#e9e6dd" stroke="#11110f" stroke-width="3"/><rect x="832" y="342" width="10" height="190" fill="#11110f"/><text x="862" y="380" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" font-weight="900" fill="#11110f">关键分工</text><text x="862" y="424" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21" font-weight="900" fill="#11110f">四句话记录现场</text><text x="862" y="485" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#5c5a54">把复杂问题拆成能执行的动作</text><rect x="88" y="570" width="444" height="190" fill="#dff0e8" stroke="#11110f" stroke-width="3"/><rect x="88" y="570" width="10" height="190" fill="#f0523e"/><text x="118" y="608" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" font-weight="900" fill="#f0523e">你要做什么</text><text x="118" y="652" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21" font-weight="900" fill="#11110f">一次只改一个地方</text><text x="118" y="713" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#5c5a54">带着真实任务开始</text><rect x="578" y="570" width="444" height="190" fill="#f8ded7" stroke="#11110f" stroke-width="3"/><rect x="578" y="570" width="10" height="190" fill="#f0523e"/><text x="608" y="608" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" font-weight="900" fill="#f0523e">检查什么</text><text x="608" y="652" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21" font-weight="900" fill="#11110f">看结果是否合格</text><text x="608" y="713" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#5c5a54">事实、格式、来源和边界</text><rect x="1068" y="570" width="444" height="190" fill="#fff4a8" stroke="#11110f" stroke-width="3"/><rect x="1068" y="570" width="10" height="190" fill="#f0523e"/><text x="1098" y="608" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" font-weight="900" fill="#f0523e">带走一句话</text><text x="1098" y="652" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21" font-weight="900" fill="#11110f">先做出结果，再沉淀方法</text><text x="1098" y="713" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#5c5a54">这节课的价值在于能复用</text></svg>