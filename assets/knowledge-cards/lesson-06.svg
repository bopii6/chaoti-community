<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><rect width="1600" height="1000" fill="#f8f2e8"/><rect x="36" y="36" width="1528" height="928" fill="#fffdf8" stroke="#11110f" stroke-width="4"/><text x="88" y="112" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#f0523e">从聊天到 Agent · 知识点卡片 06</text><text x="88" y="184" font-family="Arial, Microsoft YaHei, sans-serif" font-size="46" font-weight="900" fill="#11110f">老板怎么派活：把活交代漂亮</text><text x="88" y="254" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#5c5a54">先说意图，再谈做法：用七要素把活交代清楚，先让 AI 做到 70 分以上</text><text x="88" y="350" font-family="Arial, Microsoft YaHei, sans-serif" font-size="27" font-weight="900" fill="#11110f">这不是工具清单，是一条上手路径</text><rect x="88" y="402" width="680" height="150" fill="#fff4a8" stroke="#11110f" stroke-width="3"/><rect x="88" y="402" width="10" height="150" fill="#f0523e"/><text x="118" y="440" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" font-weight="900" fill="#f0523e">01</text><text x="118" y="484" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21" font-weight="900" fill="#11110f">第一原则：先说意图，不要替 AI </text><text x="118" y="515" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21" font-weight="900" fill="#11110f">设计操作</text><text x="118" y="545" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#5c5a54">你能先告诉 AI 真正想达成的结果，再按任务复杂</text><text x="118" y="571" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#5c5a54">度补充角色、材料、Plan、参照物、边界和验收；</text><rect x="818" y="402" width="680" height="150" fill="#dff0e8" stroke="#11110f" stroke-width="3"/><rect x="818" y="402" width="10" height="150" fill="#f0523e"/><text x="848" y="440" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" font-weight="900" fill="#f0523e">02</text><text x="848" y="484" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21" font-weight="900" fill="#11110f">胖东来：告诉它目的地，不规定路线</text><text x="848" y="545" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#5c5a54">照着步骤操作，并检查结果</text><rect x="88" y="590" width="680" height="150" fill="#fff4a8" stroke="#11110f" stroke-width="3"/><rect x="88" y="590" width="10" height="150" fill="#f0523e"/><text x="118" y="628" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" font-weight="900" fill="#f0523e">03</text><text x="118" y="672" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21" font-weight="900" fill="#11110f">多看几个对照：方向够清楚，方法留给</text><text x="118" y="703" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21" font-weight="900" fill="#11110f">它</text><text x="118" y="733" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#5c5a54">照着步骤操作，并检查结果</text><rect x="818" y="590" width="680" height="150" fill="#dff0e8" stroke="#11110f" stroke-width="3"/><rect x="818" y="590" width="10" height="150" fill="#f0523e"/><text x="848" y="628" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" font-weight="900" fill="#f0523e">04</text><text x="848" y="672" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21" font-weight="900" fill="#11110f">什么时候可以说具体细节</text><text x="848" y="733" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#5c5a54">照着步骤操作，并检查结果</text><text x="88" y="842" font-family="Arial, Microsoft YaHei, sans-serif" font-size="31" font-weight="900" fill="#f0523e">从知道 → 会用 → 跑通 → 复用</text></svg>