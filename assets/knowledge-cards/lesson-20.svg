<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><rect width="1600" height="1000" fill="#f8f2e8"/><rect x="36" y="36" width="1528" height="928" fill="#fffdf8" stroke="#11110f" stroke-width="4"/><text x="88" y="112" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#f0523e">Agent 能力扩展 · 知识点卡片 20</text><text x="88" y="184" font-family="Arial, Microsoft YaHei, sans-serif" font-size="46" font-weight="900" fill="#11110f">知识库进阶：为什么我们要选择 Obsidian？</text><text x="88" y="254" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#5c5a54">本地文件、Markdown、可迁移：让知识库真正适合 Agent 调用</text><text x="88" y="350" font-family="Arial, Microsoft YaHei, sans-serif" font-size="26" font-weight="900" fill="#11110f">资料不是存进去就结束，而是要让 Agent 找得到、读得懂、用得上</text><rect x="88" y="414" width="310" height="250" fill="#f8ded7" stroke="#11110f" stroke-width="3"/><rect x="88" y="414" width="10" height="250" fill="#f0523e"/><text x="118" y="452" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" font-weight="900" fill="#f0523e">来源</text><text x="118" y="496" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21" font-weight="900" fill="#11110f">为什么不是随便选一个在线知识库</text><text x="118" y="557" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#5c5a54">聊天、网页、收藏和业务资料</text><text x="420" y="545" font-family="Arial, Microsoft YaHei, sans-serif" font-size="30" font-weight="400" fill="#f0523e">→</text><rect x="480" y="414" width="310" height="250" fill="#fff4a8" stroke="#11110f" stroke-width="3"/><rect x="480" y="414" width="10" height="250" fill="#f0523e"/><text x="510" y="452" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" font-weight="900" fill="#f0523e">整理</text><text x="510" y="496" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21" font-weight="900" fill="#11110f">第一：本地文件，资料永远在自己手里</text><text x="510" y="557" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#5c5a54">标题、来源、日期、判断和用途</text><text x="812" y="545" font-family="Arial, Microsoft YaHei, sans-serif" font-size="30" font-weight="400" fill="#f0523e">→</text><rect x="872" y="414" width="310" height="250" fill="#dff0e8" stroke="#11110f" stroke-width="3"/><rect x="872" y="414" width="10" height="250" fill="#f0523e"/><text x="902" y="452" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" font-weight="900" fill="#f0523e">调用</text><text x="902" y="496" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21" font-weight="900" fill="#11110f">第二：Markdown 文件，天然</text><text x="902" y="527" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21" font-weight="900" fill="#11110f">适合 Agent 调用</text><text x="902" y="557" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#5c5a54">按任务找到相关资料</text><text x="1204" y="545" font-family="Arial, Microsoft YaHei, sans-serif" font-size="30" font-weight="400" fill="#f0523e">→</text><rect x="1264" y="414" width="248" height="250" fill="#e9e6dd" stroke="#11110f" stroke-width="3"/><rect x="1264" y="414" width="10" height="250" fill="#11110f"/><text x="1294" y="452" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" font-weight="900" fill="#11110f">产出</text><text x="1294" y="496" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21" font-weight="900" fill="#11110f">第三：普通文件夹结构，机器和人都能</text><text x="1294" y="527" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21" font-weight="900" fill="#11110f">理解</text><text x="1294" y="557" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#5c5a54">答案更具体，更像你的业务</text><text x="88" y="820" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25" font-weight="900" fill="#43a56f">知识库不是收藏夹，是可复用的业务上下文。</text></svg>