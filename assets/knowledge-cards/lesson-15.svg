<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><rect width="1600" height="1000" fill="#f8f2e8"/><rect x="36" y="36" width="1528" height="928" fill="#fffdf8" stroke="#11110f" stroke-width="4"/><text x="88" y="112" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#f0523e">Agent 能力扩展 · 知识点卡片 15</text><text x="88" y="184" font-family="Arial, Microsoft YaHei, sans-serif" font-size="46" font-weight="900" fill="#11110f">Skills 进阶：无痛制作 Skills 技能，做出专</text><text x="88" y="240" font-family="Arial, Microsoft YaHei, sans-serif" font-size="46" font-weight="900" fill="#11110f">属的技能</text><text x="88" y="254" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#5c5a54">先跑一遍，再沉淀：把一套稳定方法变成 Agent 的专属技能</text><text x="88" y="350" font-family="Arial, Microsoft YaHei, sans-serif" font-size="28" font-weight="900" fill="#11110f">把经验变成 Agent 可以反复调用的方法</text><rect x="88" y="414" width="400" height="250" fill="#fff4a8" stroke="#11110f" stroke-width="3"/><rect x="88" y="414" width="10" height="250" fill="#f0523e"/><text x="118" y="452" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" font-weight="900" fill="#f0523e">输入</text><text x="118" y="496" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21" font-weight="900" fill="#11110f">核心方法：先跑一遍，再沉淀技能</text><text x="118" y="557" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#5c5a54">书、文章、高手方法或一个真实任务</text><text x="515" y="545" font-family="Arial, Microsoft YaHei, sans-serif" font-size="30" font-weight="400" fill="#f0523e">→</text><rect x="590" y="414" width="400" height="250" fill="#e9e6dd" stroke="#11110f" stroke-width="3"/><rect x="590" y="414" width="10" height="250" fill="#11110f"/><text x="620" y="452" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" font-weight="900" fill="#11110f">处理</text><text x="620" y="496" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21" font-weight="900" fill="#11110f">为什么用 PPT 举例：统一、可复</text><text x="620" y="527" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21" font-weight="900" fill="#11110f">用、变化慢</text><text x="620" y="557" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#5c5a54">拆步骤、补边界、写自检和示例</text><text x="1017" y="545" font-family="Arial, Microsoft YaHei, sans-serif" font-size="30" font-weight="400" fill="#f0523e">→</text><rect x="1090" y="414" width="400" height="250" fill="#dff0e8" stroke="#11110f" stroke-width="3"/><rect x="1090" y="414" width="10" height="250" fill="#f0523e"/><text x="1120" y="452" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" font-weight="900" fill="#f0523e">输出</text><text x="1120" y="496" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21" font-weight="900" fill="#11110f">四步做出你的专属 PPT 风格技能</text><text x="1120" y="557" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#5c5a54">换一份新材料，再跑一次验证</text><text x="88" y="820" font-family="Arial, Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#f0523e">保留有效能力，修改不适合自己的部分。</text></svg>