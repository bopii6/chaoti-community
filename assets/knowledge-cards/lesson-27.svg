<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><rect width="1600" height="1000" fill="#f8f2e8"/><rect x="36" y="36" width="1528" height="928" fill="#fffdf8" stroke="#11110f" stroke-width="4"/><text x="88" y="112" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#f0523e">工作流和自动化案例 · 知识点卡片 27</text><text x="88" y="184" font-family="Arial, Microsoft YaHei, sans-serif" font-size="46" font-weight="900" fill="#11110f">人在外面玩，活照样干：手机自动化办公</text><text x="88" y="254" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#5c5a54">Codex + 浏览器自动化 + 悠悠远程 + 一部手机，边溜达边把活干完</text><text x="88" y="350" font-family="Arial, Microsoft YaHei, sans-serif" font-size="28" font-weight="900" fill="#11110f">案例不是讲概念，而是把一条真实任务完整跑通</text><rect x="88" y="430" width="330" height="190" fill="#fff4a8" stroke="#11110f" stroke-width="3"/><rect x="88" y="430" width="10" height="190" fill="#f0523e"/><text x="118" y="468" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" font-weight="900" fill="#f0523e">输入</text><text x="118" y="512" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21" font-weight="900" fill="#11110f">真实任务</text><text x="118" y="573" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#5c5a54">你每天反复做、结果可检查的事</text><text x="448" y="520" font-family="Arial, Microsoft YaHei, sans-serif" font-size="30" font-weight="400" fill="#f0523e">→</text><rect x="510" y="430" width="330" height="190" fill="#dff0e8" stroke="#11110f" stroke-width="3"/><rect x="510" y="430" width="10" height="190" fill="#f0523e"/><text x="540" y="468" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" font-weight="900" fill="#f0523e">执行</text><text x="540" y="512" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21" font-weight="900" fill="#11110f">Agent + 工具</text><text x="540" y="573" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#5c5a54">按固定步骤推进，不靠每次重新猜</text><text x="898" y="520" font-family="Arial, Microsoft YaHei, sans-serif" font-size="30" font-weight="400" fill="#f0523e">→</text><rect x="960" y="430" width="330" height="190" fill="#f8ded7" stroke="#11110f" stroke-width="3"/><rect x="960" y="430" width="10" height="190" fill="#f0523e"/><text x="990" y="468" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" font-weight="900" fill="#f0523e">检查</text><text x="990" y="512" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21" font-weight="900" fill="#11110f">关键节点确认</text><text x="990" y="573" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#5c5a54">登录、发送、发布和删除先停下</text><text x="1348" y="520" font-family="Arial, Microsoft YaHei, sans-serif" font-size="30" font-weight="400" fill="#f0523e">→</text><rect x="1400" y="430" width="112" height="190" fill="#e9e6dd" stroke="#11110f" stroke-width="3"/><rect x="1400" y="430" width="10" height="190" fill="#11110f"/><text x="1430" y="468" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" font-weight="900" fill="#11110f">结果</text><text x="1430" y="512" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21" font-weight="900" fill="#11110f">交付</text><text x="1430" y="573" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#5c5a54">可复用</text><text x="88" y="820" font-family="Arial, Microsoft YaHei, sans-serif" font-size="26" font-weight="900" fill="#f0523e">看完案例后，换成你自己的任务再跑一次。</text></svg>