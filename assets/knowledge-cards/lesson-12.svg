<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><rect width="1600" height="1000" fill="#f8f2e8"/><rect x="36" y="36" width="1528" height="928" fill="#fffdf8" stroke="#11110f" stroke-width="4"/><text x="88" y="112" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#f0523e">Agent 能力扩展 · 知识点卡片 12</text><text x="88" y="184" font-family="Arial, Microsoft YaHei, sans-serif" font-size="46" font-weight="900" fill="#11110f">给足上下文：上传截图，让 AI 快速定位问题</text><text x="88" y="254" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#5c5a54">用参考图说明目标，用标注图指出不满，让 AI 少猜一步</text><rect x="88" y="342" width="680" height="190" fill="#fff4a8" stroke="#11110f" stroke-width="3"/><rect x="88" y="342" width="10" height="190" fill="#f0523e"/><text x="118" y="380" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" font-weight="900" fill="#f0523e">核心判断</text><text x="118" y="424" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21" font-weight="900" fill="#11110f">为什么截图能让 AI 少猜一步</text><text x="118" y="485" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#5c5a54">你能判断什么时候应该截图，知道截图要拍什么、标什</text><text x="118" y="511" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#5c5a54">么、配什么文字，并让 AI 先定位问题再执行修改</text><rect x="832" y="342" width="680" height="190" fill="#e9e6dd" stroke="#11110f" stroke-width="3"/><rect x="832" y="342" width="10" height="190" fill="#11110f"/><text x="862" y="380" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" font-weight="900" fill="#11110f">关键分工</text><text x="862" y="424" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21" font-weight="900" fill="#11110f">场景一：给 AI 一个参考网站，说</text><text x="862" y="455" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21" font-weight="900" fill="#11110f">明你想做成什么</text><text x="862" y="485" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#5c5a54">把复杂问题拆成能执行的动作</text><rect x="88" y="570" width="444" height="190" fill="#dff0e8" stroke="#11110f" stroke-width="3"/><rect x="88" y="570" width="10" height="190" fill="#f0523e"/><text x="118" y="608" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" font-weight="900" fill="#f0523e">你要做什么</text><text x="118" y="652" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21" font-weight="900" fill="#11110f">场景二：结果不满意，但你说不清哪里</text><text x="118" y="683" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21" font-weight="900" fill="#11110f">不满意</text><text x="118" y="713" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#5c5a54">带着真实任务开始</text><rect x="578" y="570" width="444" height="190" fill="#f8ded7" stroke="#11110f" stroke-width="3"/><rect x="578" y="570" width="10" height="190" fill="#f0523e"/><text x="608" y="608" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" font-weight="900" fill="#f0523e">检查什么</text><text x="608" y="652" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21" font-weight="900" fill="#11110f">场景三：网页报错、按钮没反应或流程</text><text x="608" y="683" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21" font-weight="900" fill="#11110f">卡住</text><text x="608" y="713" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#5c5a54">事实、格式、来源和边界</text><rect x="1068" y="570" width="444" height="190" fill="#fff4a8" stroke="#11110f" stroke-width="3"/><rect x="1068" y="570" width="10" height="190" fill="#f0523e"/><text x="1098" y="608" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" font-weight="900" fill="#f0523e">带走一句话</text><text x="1098" y="652" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21" font-weight="900" fill="#11110f">先做出结果，再沉淀方法</text><text x="1098" y="713" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#5c5a54">这节课的价值在于能复用</text></svg>