<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>课程知识点卡片预览</title>
    <style>
      :root { color-scheme: light; --ink: #171714; --paper: #f6f1e8; --yellow: #f5df36; }
      * { box-sizing: border-box; }
      body { margin: 0; color: var(--ink); background: var(--paper); font-family: Arial, "Microsoft YaHei", sans-serif; }
      header { padding: 42px 5vw 34px; border-bottom: 2px solid var(--ink); background: var(--yellow); }
      header p { margin: 0 0 10px; font-size: 12px; font-weight: 800; letter-spacing: .14em; }
      h1 { margin: 0; font-size: clamp(30px, 5vw, 64px); line-height: 1; }
      header small { display: block; margin-top: 18px; font-size: 15px; }
      main { width: min(1500px, 90vw); margin: 0 auto; padding: 40px 0 80px; }
      section { margin-bottom: 62px; }
      .section-head { display: flex; align-items: baseline; gap: 16px; margin-bottom: 22px; border-bottom: 2px solid var(--ink); }
      .section-head h2 { margin: 0 0 10px; font-size: clamp(22px, 3vw, 36px); }
      .section-head span { color: #6c6860; font-size: 14px; }
      .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px; }
      figure { margin: 0; }
      .card { display: block; width: 100%; aspect-ratio: 2 / 3; object-fit: cover; background: #fff; border: 1px solid var(--ink); box-shadow: 5px 5px 0 var(--ink); }
      .card-placeholder { display: grid; place-items: center; padding: 24px; color: #6c6860; text-align: center; font-size: 16px; font-weight: 800; line-height: 1.45; }
      figcaption { display: flex; gap: 10px; align-items: flex-start; padding-top: 12px; font-size: 14px; line-height: 1.45; font-weight: 700; }
      figcaption b { flex: 0 0 auto; color: #a9432e; }
      @media (max-width: 1000px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
      @media (max-width: 680px) { header { padding: 28px 20px; } main { width: auto; margin: 0 20px; padding-top: 28px; } .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 14px; } .card { box-shadow: 3px 3px 0 var(--ink); } figcaption { font-size: 12px; gap: 6px; } }
    </style>
  </head>
  <body>

      <p>小王 AI 课 · KNOWLEDGE CARDS</p>
