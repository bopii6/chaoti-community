<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <rect width="1600" height="1000" fill="#f8f2e8"/>
  <rect x="36" y="36" width="1528" height="928" fill="#fffdf8" stroke="#11110f" stroke-width="4"/>
  <text x="88" y="112" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#f0523e">浏览器自动化进阶 · 知识点卡片 14</text>
  <text x="88" y="180" font-family="Arial, Microsoft YaHei, sans-serif" font-size="44" font-weight="900" fill="#11110f">收藏不是终点，</text>
  <text x="440" y="180" font-family="Arial, Microsoft YaHei, sans-serif" font-size="44" font-weight="900" fill="#f0523e">让好内容再次工作</text>
  <text x="88" y="222" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19" fill="#5c5a54">让 Agent 从你已经收藏的宝贝里，找到下一次创作真正用得上的东西。</text>
  <image href="preview-qilin-browser-flow-art.png" x="88" y="262" width="1424" height="627" preserveAspectRatio="xMidYMid slice"/>
  <rect x="107" y="302" width="242" height="78" rx="8" fill="#fff4a8" stroke="#11110f" stroke-width="3"/>
  <text x="126" y="330" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="900" fill="#f0523e">01 · 先有好素材</text>
  <text x="126" y="360" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20" font-weight="900" fill="#11110f">打开你的收藏</text>
  <rect x="565" y="302" width="242" height="78" rx="8" fill="#fff4a8" stroke="#11110f" stroke-width="3"/>
  <text x="584" y="330" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="900" fill="#f0523e">02 · 限定范围</text>
  <text x="584" y="360" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20" font-weight="900" fill="#11110f">让 Agent 去筛选</text>
  <rect x="1035" y="302" width="242" height="78" rx="8" fill="#dff0e8" stroke="#11110f" stroke-width="3"/>
  <text x="1054" y="330" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="900" fill="#43a56f">03 · 找到重点</text>
  <text x="1054" y="360" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20" font-weight="900" fill="#11110f">分析观点和价值</text>
  <rect x="230" y="716" width="242" height="78" rx="8" fill="#dff0e8" stroke="#11110f" stroke-width="3"/>
  <text x="249" y="744" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="900" fill="#43a56f">04 · 变成你的资产</text>
  <text x="249" y="774" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20" font-weight="900" fill="#11110f">写进 Obsidian</text>
  <rect x="1035" y="716" width="242" height="78" rx="8" fill="#f8ded7" stroke="#11110f" stroke-width="3"/>
  <text x="1054" y="744" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="900" fill="#f0523e">05 · 二次利用</text>
  <text x="1054" y="774" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20" font-weight="900" fill="#11110f">变成下一次选题</text>
  <line x1="88" y1="912" x2="1512" y2="912" stroke="#11110f" stroke-width="3"/>
  <text x="88" y="946" font-family="Arial, Microsoft YaHei, sans-serif" font-size="22" font-weight="900" fill="#11110f">浏览器自动化的关键：不是到处搜索，而是把你已经筛选过的收藏交给 Agent 二次利用。</text>
</svg>
